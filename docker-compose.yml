services:
  api-node:
    build:
      context: ./api-node
    ports:
      - "${NODE_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  api-go:
    build:
      context: ./api-go
    ports:
      - "${GO_PORT:-3000}:3000"
    environment:
      NODE_STATISTICS_URL: http://api-node:3001/api/statistics
    depends_on:
      api-node:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api-go

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-go
